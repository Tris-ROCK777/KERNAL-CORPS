<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KERNEL CORP. Non-exportable Authority Vault Test</title>
<style>
body{font:16px system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.5}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:1rem;border-radius:8px}
button{font:inherit;padding:.7rem 1rem}
</style>
</head>
<body>
<h1>Non-exportable authority vault — browser test</h1>
<p>This creates a temporary experimental key in a unique IndexedDB database. It does not modify the enrolled production authority vault.</p>
<button id="run">Run tests</button>
<pre id="result">READY</pre>
<script type="module">
const output = document.querySelector("#result");
const button = document.querySelector("#run");
button.addEventListener("click", async () => {
  button.disabled = true;
  output.textContent = "RUNNING";
  const checks = [];
  try {
    if (!globalThis.crypto?.subtle || !globalThis.indexedDB) {
      throw new Error("REQUIRED_BROWSER_APIS_UNAVAILABLE");
    }
    const { NonExportableAuthorityVault: Vault } =
      await import("./overseer-non-exportable-authority-vault.mjs");
    if (!Vault) throw new Error("MODULE_EXPORT_MISSING");
    const databaseName = "kernel-authority-vault-test-" + crypto.randomUUID();
    const first = new Vault({ databaseName });
    const pair = await first.initOrRestore({ allowFirstBootProvisioning: true });
    checks.push(["first boot creates key", !!pair.privateKey]);
    checks.push(["private key is non-exportable", pair.privateKey.extractable === false]);
    checks.push(["public key is 32-byte Ed25519 hex", /^[a-f0-9]{64}$/.test(first.getPublicKeyHex())]);
    const challenge = new TextEncoder().encode("KERNEL_NON_EXPORTABLE_VAULT_TEST_V1");
    const signature = await crypto.subtle.sign("Ed25519", pair.privateKey, challenge);
    checks.push(["private key can sign and verify", await crypto.subtle.verify("Ed25519", pair.publicKey, signature, challenge)]);
    const restored = new Vault({ expectedPublicKeyHex: first.getPublicKeyHex(), databaseName });
    await restored.initOrRestore();
    checks.push(["IndexedDB restores same identity", restored.getPublicKeyHex() === first.getPublicKeyHex() && restored.getStatus().restored]);
    checks.push(["restored private key remains non-exportable", restored.keyPair.privateKey.extractable === false]);
    const mismatch = new Vault({ expectedPublicKeyHex: "ab".repeat(32), databaseName });
    let mismatchRejected = false;
    try { await mismatch.initOrRestore(); }
    catch (error) { mismatchRejected = error.message === "AUTHORITY_PUBLIC_KEY_PIN_MISMATCH"; }
    checks.push(["wrong public-key pin is rejected", mismatchRejected]);
    const failed = checks.filter(([, passed]) => !passed);
    output.textContent = JSON.stringify({
      status: failed.length ? "FAILED" : "ALL_CHECKS_PASSED",
      checks: checks.map(([name, passed]) => ({ name, passed })),
      note: "Experimental isolated IndexedDB only; production OPFS vault unchanged."
    }, null, 2);
  } catch (error) {
    output.textContent = JSON.stringify({status:"ERROR", message:error?.message || String(error), checks}, null, 2);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
