function ensureDrawerContent(key) {

  if (!pane || !template || populatedDrawers.has(key)) return;
  pane.replaceChildren(template.content.cloneNode(true));
  populatedDrawers.add(key);
  if (key === 'telemetry') {
    camFocusLabel = document.getElementById('nodeLabel');
    const snapshot = latestMeshSnapshot;
    if (snapshot) { renderMeshGlobalContext(snapshot); refreshLiveValueBindings(snapshot); }
    renderSelectedMeshNode(selectedMeshNode, snapshot);
  }
}
function clearDrawerContentAfterClose(pane, key) {
  pane.addEventListener('transitionend', event => {
    if (event.propertyName !== 'transform' || pane.classList.contains('open')) return;
    pane.replaceChildren(); populatedDrawers.delete(key);
    if (key === 'telemetry') camFocusLabel = null;
  });
}
function closeMeshDrawers() {
  Object.values(panes).forEach(p => { p.classList.remove('open'); p.setAttribute('aria-hidden', 'true'); });
  scrim.classList.remove('open');
  experience.classList.remove('telemetry-active');
  if (mesh) mesh.resetCamera();
}
function openMeshDrawer(key) {
  closeMeshDrawers();
  const pane = panes[key];
  if (!pane) return;
  ensureDrawerContent(key);
  pane.classList.add('open'); pane.setAttribute('aria-hidden', 'false');
  scrim.classList.add('open');
  if (key === 'telemetry') experience.classList.add('telemetry-active');
}
experience.addEventListener('click', event => {
  if (event.target.closest('[data-close-drawer], #closeTelemetry')) { closeMeshDrawers(); return; }
  const card = event.target.closest('.pod-card');
  if (card && !event.target.closest('a')) card.classList.toggle('flipped');
});
scrim.addEventListener('click', closeMeshDrawers);
clearDrawerContentAfterClose(panes.telemetry, 'telemetry');
clearDrawerContentAfterClose(panes.left, 'left');
clearDrawerContentAfterClose(panes.right, 'right');
for (const [key, pane] of Object.entries(panes)) {
 let origin;
 pane.addEventListener('pointerdown', e => { origin = {x:e.clientX,y:e.clientY,id:e.pointerId}; }, {passive:true});
 pane.addEventListener('pointerup', e => {
  if (!origin || origin.id !== e.pointerId) return;
  const dx=e.clientX-origin.x, dy=e.clientY-origin.y; origin=null;
  if ((key==='telemetry' && dy>55) || (key==='left' && dx< -55) || (key==='right' && dx>55)) closeMeshDrawers();
 }, {passive:true});
 pane.addEventListener('pointercancel', () => { origin=null; }, {passive:true});
}

// Gesture-first controls: the default scene stays clean; drawers are revealed only by node taps or edge swipes.
let edgeGestureStart = null;
experience.addEventListener('pointerdown', event => {
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  const width = window.innerWidth, height = window.innerHeight;
  const edge = 24;
  const fromLeft = event.clientX <= edge;
  const fromRight = event.clientX >= width - edge;
  const fromBottom = event.clientY >= height - edge;
  if (fromLeft || fromRight || fromBottom) edgeGestureStart = {x:event.clientX,y:event.clientY,fromLeft,fromRight,fromBottom,id:event.pointerId};
}, {passive:true});
experience.addEventListener('pointerup', event => {
  if (!edgeGestureStart || edgeGestureStart.id !== event.pointerId) return;
  const start = edgeGestureStart; edgeGestureStart = null;
  const dx = event.clientX - start.x, dy = event.clientY - start.y;
  if (Math.abs(dx) < 54 && Math.abs(dy) < 54) return;
  if (Math.abs(dx) > Math.abs(dy) * 1.15) {
    if (start.fromLeft && dx > 0) openMeshDrawer('left');
    else if (start.fromRight && dx < 0) openMeshDrawer('right');
  } else if (start.fromBottom && dy < -54) openMeshDrawer('telemetry');
}, {passive:true});
experience.addEventListener('pointercancel', () => { edgeGestureStart = null; }, {passive:true});
let latestMeshSnapshot = null;
let selectedMeshNode = null;
let selectedMeshKey = null;
const inspectorValue = (source, paths) => {
 for (const path of paths) { const value=path.split('.').reduce((current,part)=>current==null?undefined:current[part],source); if(value!==undefined&&value!==null&&value!=='')return value; }
 return undefined;
};
const inspectorText = value => { if(value===undefined||value===null||value==='')return 'UNAVAILABLE';if(typeof value==='object'){try{return JSON.stringify(value)}catch{return '[structured value]'}}return String(value); };
function refreshLiveValueBindings(snapshot) {
  if (!snapshot) return;
  const paths = {
    peers: ['network.livePeerCount','network.peerCount'],
    latency: ['network.latencyMs'],
    workers: ['network.workers.localActive'],
    rxBytes: ['network.bytesReceived'],
    txBytes: ['network.bytesSent'],
    shards: ['storage.shardCount'],
    verifiedBytes: ['storage.verifiedShardBytes'],
    readback: ['security.readbackStatus'],
    wal: ['storage.ringWalStatus'],
    commits: ['storage.commitCount'],
    recovery: ['storage.recoveryStatus'],
    authority: ['security.authorityStatus'],
    signature: ['security.signatureStatus'],
    gate: ['security.gateStatus'],
    lastHash: ['security.lastSha256','security.lastHash','lastSha256','lastHash']
  };
  for (const [key, candidates] of Object.entries(paths)) {
    let value;
    for (const path of candidates) {
      value = path.split('.').reduce((current, part) => current == null ? undefined : current[part], snapshot);
      if (value !== undefined && value !== null && value !== '') break;
    }
    document.querySelectorAll('[data-live-value="' + key + '"]').forEach(target => {
      target.textContent = value === undefined || value === null || value === '' ? 'UNAVAILABLE' : String(value);
    });
  }
}
function renderMeshGlobalContext(snapshot) {
 const target=document.getElementById('meshGlobalContext');
 if(!target||!snapshot)return;
 const val=paths=>inspectorValue(snapshot,paths);
 const fields=[
  ['NETWORK / LATENCY',()=>{const peers=val(['network.livePeerCount','network.peerCount','livePeerCount','peerCount']);const latency=val(['network.latencyMs','network.latency','latencyMs']);return inspectorText(peers)+' peers / '+(latency===undefined?'UNAVAILABLE':inspectorText(latency)+(typeof latency==='number'?' ms':''));}],
  ['ACTIVE WORKERS / TARGET',()=>inspectorText(val(['network.workers.localActive','workers.localActive','localWorkersActive']))+' / '+inspectorText(val(['network.workers.architectureTarget','network.architectureTarget','architectureTarget'])??10000)],
  ['NETWORK RX / TX BYTES',()=>{const rx=val(['network.bytesReceived','bytesReceived']);const tx=val(['network.bytesSent','network.bytesSentTotal','bytesSent']);return 'RX '+inspectorText(rx)+' / TX '+inspectorText(tx);}],
  ['SHARDS / VERIFIED BYTES',()=>{const shards=val(['storage.shardCount','shardCount']);const bytes=val(['storage.verifiedShardBytes','storage.verifiedBytes','verifiedShardBytes']);return inspectorText(shards)+' / '+inspectorText(bytes)+' bytes';}],
  ['OPFS BYTES',()=>inspectorText(val(['storage.opfsBytes','storage.bytes','opfsBytes']))],
  ['RING-WAL / RECOVERY',()=>inspectorText(val(['storage.ringWalStatus','storage.walStatus','ringWalStatus']))+' / '+inspectorText(val(['storage.recoveryStatus']))],
  ['AUTHORITY / SIGNATURE / GATE',()=>inspectorText(val(['security.authorityStatus','security.authority','authorityStatus']))+' / '+inspectorText((()=>{const x=val(['security.signatureStatus','security.signatureVerified']);return typeof x==='boolean'?(x?'VERIFIED':'NOT VERIFIED'):x})())+' / '+inspectorText(val(['security.gateStatus','security.failClosedStatus','gateStatus']))],
  ['READ-BACK / SHA-256 / RECEIPTS',()=>inspectorText(val(['security.readbackStatus','storage.readbackStatus','readbackStatus']))+' / '+inspectorText(val(['security.lastSha256','security.lastHash','lastSha256','lastHash']))+' / '+inspectorText(val(['security.receiptCount','storage.receiptCount','receiptCount']))]
 ];
 target.replaceChildren();
 for(const [caption,getValue] of fields){
  const cell=document.createElement('div');if(caption.startsWith('READ-BACK'))cell.className='selected-node-wide';
  const small=document.createElement('small');small.textContent=caption;
  const strong=document.createElement('strong');strong.textContent=getValue();
  cell.append(small,strong);target.append(cell);
 }
 const records=val(['security.records','records']);
 const evidenceTitle=document.createElement('div');evidenceTitle.className='mesh-context-head selected-node-wide';evidenceTitle.textContent='RECENT CRYPTOGRAPHIC RECEIPTS / SOURCE EVIDENCE';target.append(evidenceTitle);
 if(!Array.isArray(records)||records.length===0){
  const empty=document.createElement('div');empty.className='selected-node-wide mesh-evidence-empty';empty.textContent='No receipt records supplied by the current telemetry snapshot.';target.append(empty);
 }else{
  records.slice(-8).reverse().forEach((record,index)=>{
   const item=document.createElement('div');item.className='mesh-evidence-record selected-node-wide';
   const heading=document.createElement('strong');heading.textContent=String(record.source||record.peerId||record.id||('RECEIPT '+(records.length-index)));
   const hash=document.createElement('code');hash.textContent='SHA-256  '+inspectorText(record.sha256||record.receipt?.sha256);
   const detail=document.createElement('span');detail.textContent='BYTES '+inspectorText(record.byteLength??record.receipt?.byteLength)+' · SIGNATURE '+inspectorText(record.signatureVerified??record.receipt?.signatureVerified)+' · AUTHORITY PIN '+inspectorText(record.authorityPinMatched??record.receipt?.authorityPinMatched)+' · READ-BACK '+inspectorText(record.readBackVerified??record.receipt?.readBackVerified);
   item.append(heading,hash,detail);target.append(item);
  });
 }
}
function renderSelectedMeshNode(node,snapshot) {
 const title=document.getElementById('selectedNodeTitle'),state=document.getElementById('selectedNodeState'),grid=document.getElementById('selectedNodeGrid'),note=document.getElementById('selectedNodeNote');
 if(!title||!state||!grid||!note)return;
 if(!node){title.textContent='Tap a mesh node';state.textContent='NO SELECTION';note.textContent='Tap any mesh node to inspect its reported fields. Global values are not substituted for missing peer-level values.';return;}
 const label=inspectorValue(node,['name','label','id','peerId','peer_id','nodeId'])??'Selected mesh node';
 const status=inspectorValue(node,['state','status','connectionState','readyState','health']);
 const latency=inspectorValue(node,['latencyMs','latency','rttMs','metrics.latencyMs']);
 const rx=inspectorValue(node,['bytesReceived','rxBytes','bytesIn','network.bytesReceived']),tx=inspectorValue(node,['bytesSent','txBytes','bytesOut','network.bytesSent']);
 const shards=inspectorValue(node,['shardCount','shards','storage.shardCount']),bytes=inspectorValue(node,['verifiedShardBytes','storage.verifiedShardBytes','opfsBytes','storage.opfsBytes']);
 const authority=inspectorValue(node,['authorityStatus','security.authorityStatus','authority']),signature=inspectorValue(node,['signatureStatus','signatureVerified','security.signatureStatus','security.signatureVerified']);
 const hash=inspectorValue(node,['lastSha256','sha256','hash','receipt.sha256','security.lastSha256']),receipt=inspectorValue(node,['receiptId','receipt.id','receiptCount','security.receiptCount']);
 const fields=[['NODE ID',inspectorValue(node,['id','peerId','peer_id','nodeId','connectionId'])],['CONNECTION',status],['LATENCY',latency===undefined?undefined:(typeof latency==='number'?latency+' ms':latency)],['RX / TX BYTES',rx===undefined&&tx===undefined?undefined:'RX '+inspectorText(rx)+' / TX '+inspectorText(tx)],['SHARDS / VERIFIED BYTES',shards===undefined&&bytes===undefined?undefined:inspectorText(shards)+' / '+inspectorText(bytes)+' bytes'],['AUTHORITY / SIGNATURE',authority===undefined&&signature===undefined?undefined:inspectorText(authority)+' / '+(typeof signature==='boolean'?(signature?'VERIFIED':'NOT VERIFIED'):inspectorText(signature))],['SHA-256 / RECEIPT',hash===undefined&&receipt===undefined?undefined:inspectorText(hash)+' / '+inspectorText(receipt)]];
 title.textContent=String(label);state.textContent=status===undefined?'STATE UNAVAILABLE':String(status).toUpperCase();grid.replaceChildren();
 for(const [caption,value] of fields){const cell=document.createElement('div');if(caption==='SHA-256 / RECEIPT')cell.className='selected-node-wide';const small=document.createElement('small');small.textContent=caption;const strong=document.createElement('strong');strong.textContent=inspectorText(value);cell.append(small,strong);grid.append(cell);}
 const peers=inspectorValue(snapshot,['network.peers','peers','nodes']);const id=inspectorValue(node,['id','peerId','peer_id','nodeId']);
 const match=Array.isArray(peers)&&peers.some(peer=>String(peer.id??peer.peerId??peer.peer_id??'')===String(id??''));
 note.textContent=match?'Selected node matches an entry in the latest peer snapshot. Missing fields were not supplied by that peer.':'Selected mesh node is shown with its own reported fields. Global metrics are not copied into missing peer fields.';
}
const mesh = new XKomzMasterInterface(mount, {
  viewportOnly: true,
  onSnapshot(snapshot) {
    latestMeshSnapshot = snapshot;
    renderMeshGlobalContext(snapshot);
    if (selectedMeshNode) {
      const peers = inspectorValue(snapshot, ['network.peers','peers','nodes']);
      const selectedId = inspectorValue(selectedMeshNode, ['id','peerId','peer_id','nodeId','connectionId']);
      let refreshed = null;
      if (Array.isArray(peers)) {
        if (selectedId !== undefined && selectedId !== null && String(selectedId).trim() !== '') {
          refreshed = peers.find(peer => {
            const id = inspectorValue(peer, ['id','peerId','peer_id','nodeId','connectionId']);
            return id !== undefined && id !== null && String(id).trim() !== '' && String(id) === String(selectedId);
          }) || null;
        } else if (selectedMeshKey && selectedMeshKey.startsWith('index:')) {
          const index = Number(selectedMeshKey.slice(6));
          if (Number.isInteger(index) && index >= 0 && index < peers.length) {
            const candidate = peers[index];
            const candidateId = inspectorValue(candidate, ['id','peerId','peer_id','nodeId','connectionId']);
            if (candidateId === undefined || candidateId === null || String(candidateId).trim() === '') refreshed = candidate;
          }
        }
      }
      if (refreshed) selectedMeshNode = refreshed;
      renderSelectedMeshNode(selectedMeshNode, latestMeshSnapshot);
    }
    refreshLiveValueBindings(snapshot);
  },
  onNodeSelected(node) {
    // The mesh passes its explicit key for anonymous nodes. Never match two
    // missing IDs as equal: that cross-wires the inspector to an unrelated peer.
    const clicked = node?.raw && typeof node.raw === 'object' ? node.raw : (node || null);
    const clickedId = inspectorValue(clicked, ['id','peerId','peer_id','nodeId','connectionId']);
    const peers = inspectorValue(latestMeshSnapshot, ['network.peers','peers','nodes']);
    selectedMeshKey = typeof node?.meshKey === 'string' ? node.meshKey : null;
    let resolved = null;
    if (Array.isArray(peers)) {
      if (clickedId !== undefined && clickedId !== null && String(clickedId).trim() !== '') {
        resolved = peers.find(peer => {
          const id = inspectorValue(peer, ['id','peerId','peer_id','nodeId','connectionId']);
          return id !== undefined && id !== null && String(id).trim() !== '' && String(id) === String(clickedId);
        }) || null;
      } else if (selectedMeshKey && selectedMeshKey.startsWith('index:')) {
        const index = Number(selectedMeshKey.slice(6));
        if (Number.isInteger(index) && index >= 0 && index < peers.length) {
          const candidate = peers[index];
          const id = inspectorValue(candidate, ['id','peerId','peer_id','nodeId','connectionId']);
          if (id === undefined || id === null || String(id).trim() === '') resolved = candidate;
        }
      }
    }
    selectedMeshNode = resolved || clicked;
    openMeshDrawer('telemetry');
    renderSelectedMeshNode(selectedMeshNode, latestMeshSnapshot);
    const label = selectedMeshNode?.name || selectedMeshNode?.label || selectedMeshNode?.id || selectedMeshNode?.peerId || selectedMeshNode?.peer_id || 'SELECTED MESH NODE';
    if (camFocusLabel) camFocusLabel.textContent = 'PEER NODE / ' + String(label).toUpperCase();
    document.getElementById('meshAnnouncement').textContent = 'Selected peer node ' + label + '. Inspector fields refresh from each incoming telemetry snapshot.';
  },
  onGesture(edge) {
    if (edge === 'left') openMeshDrawer('left');
    else if (edge === 'right') openMeshDrawer('right');
    else closeMeshDrawers();
  }
});
window.addEventListener('pagehide', () => mesh.destroy(), { once: true });
</script>


<script>
// Keep the immersive viewport uncluttered; expose every operational tool through the node drawer.
document.querySelectorAll('[data-live-tool]').forEach(button=>button.addEventListener('click',()=>{
 const frame=document.getElementById('telemetryConsole');
 const title=document.getElementById('telemetryToolTitle');
 if(!frame||!title)return;
 document.querySelectorAll('[data-live-tool]').forEach(item=>item.classList.toggle('active',item===button));
 title.textContent=button.dataset.liveTitle||'LIVE OPERATIONS';
 const url=new URL(button.dataset.liveTool,location.href);url.searchParams.set('kernelBuild','mesh-drawer-v1');
 frame.src=url.href;
 frame.title=title.textContent+' — live KERNEL operational tool';
}));
</script>
