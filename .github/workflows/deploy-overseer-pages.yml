name: Deploy Overseer Verification Page

on:
  # Manual fallback only. Automatic deployments are owned by overseer-pages.yml
  # so two workflows cannot cancel or race each other on the same Pages site.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KERNELCORP
        uses: actions/checkout@v4

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package Overseer verification site
        uses: actions/upload-pages-artifact@v3
        with:
          path: overseer

      - name: Deploy verification site
        id: deployment
        uses: actions/deploy-pages@v4
