name: Deploy Overseer Verification Page

on:
  push:
    branches: [main, master]
    paths:
      - "overseer/**"
      - ".github/workflows/deploy-overseer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KERNELCORP
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package Overseer verification site
        uses: actions/upload-pages-artifact@v3
        with:
          path: overseer

      - name: Deploy verification site
        id: deployment
        uses: actions/deploy-pages@v4
