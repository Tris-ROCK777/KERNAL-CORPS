name: Authority Security Tests

on:
  pull_request:
    paths:
      - "overseer/**"
      - ".github/workflows/authority-security-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "overseer/**"
      - ".github/workflows/authority-security-tests.yml"

permissions:
  contents: read

jobs:
  authority-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run authority key vault tests
        run: node overseer/overseer-key-vault.test.mjs
      - name: Run pinned authority tests
        run: node overseer/overseer-pinned-authority.test.mjs
      - name: Run authority bootstrap tests
        run: node overseer/overseer-authority-bootstrap.test.mjs
      - name: Check experimental non-exportable vault syntax
        run: node --check overseer/overseer-non-exportable-authority-vault.mjs
