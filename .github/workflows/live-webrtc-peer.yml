name: Live WebRTC Peer Verification

on:
  workflow_run:
    workflows: ["Deploy KERNEL CORP to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  sender:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Send test shard over live WebRTC
        env:
          KERNEL_PEER_ROLE: sender
          KERNEL_PEER_ROOM: kernelci_${{ github.run_id }}
          KERNEL_PEER_URL: https://tris-rock777.github.io/KERNAL-CORPS/overseer/live-peer-verify.html
        run: node scripts/live-peer-ci.mjs

  receiver:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Receive and verify live WebRTC shard
        env:
          KERNEL_PEER_ROLE: receiver
          KERNEL_PEER_ROOM: kernelci_${{ github.run_id }}
          KERNEL_PEER_URL: https://tris-rock777.github.io/KERNAL-CORPS/overseer/live-peer-verify.html
        run: node scripts/live-peer-ci.mjs
