name: Deploy Overseer Mobile Verifier

on:
  push:
    branches: [main]
    paths:
      - "overseer/**"
      - ".github/workflows/overseer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout KERNELCORP
        uses: actions/checkout@v4

      - name: Set up Node.js for zero-dependency verification
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check real-browser OPFS verification module
        run: node --check overseer/overseer-opfs-persistence.test.mjs

      - name: Run mesh, storage-recovery and signaling invariants
        run: node overseer/run-verify.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble mobile verifier
        run: |
          mkdir -p _site/overseer
          cp -R overseer/. _site/overseer/
          cp overseer/verify.html _site/overseer/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
