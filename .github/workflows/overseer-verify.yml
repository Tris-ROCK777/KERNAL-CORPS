name: Overseer Hot-Swap & Mesh Verification

on:
  push:
    branches: [main, master, security/zero-trust-live-storage-gate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-overseer-mesh:
    name: Node E2E mesh verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout KERNELCORP
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Install relay test transport dependency
        run: npm install --no-save --no-package-lock ws

      - name: Execute signaling relay regression tests
        run: node server-signaling.test.mjs

      - name: Run non-exportable authority vault regression tests
        run: node overseer/overseer-non-exportable-authority-vault.test.mjs

      - name: Execute Overseer E2E Mesh & Hot-Swap Suite
        run: node overseer/run-verify.mjs
